<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>보이스피싱 유형 - 피싱안심</title>
<meta name="theme-color" content="#003478">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="back-btn" href="types.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      뒤로
    </a>
  </div>

  <div class="screen-shot-wrap">
    <img id="shotImg" alt="">
    <div class="hotspot-layer" id="hotspotLayer"></div>
  </div>

  <p class="play-status" id="playStatus"></p>
</div>

<script src="js/types-data.js?v=9"></script>
<script src="js/app.js?v=9"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const type = PHISHING_TYPES.find(t => t.id === id);
  const img = document.getElementById('shotImg');
  const layer = document.getElementById('hotspotLayer');

  if (!type) {
    document.querySelector('.screen-shot-wrap').innerHTML = '<p style="text-align:center;padding:40px 20px;">유형을 찾을 수 없습니다</p>';
  } else {
    document.title = `${type.title} - 피싱안심`;
    img.src = type.image;
    img.alt = `[${type.title}]`;

    const descBtn = document.createElement('button');
    descBtn.className = 'hotspot';
    const pos = type.real ? HOTSPOT_TWO_BTN.desc : HOTSPOT_ONE_BTN.desc;
    descBtn.setAttribute('style', pos);
    descBtn.setAttribute('data-audio', type.desc);
    descBtn.setAttribute('data-status-for', 'playStatus');
    descBtn.setAttribute('aria-label', '설명 듣기');
    layer.appendChild(descBtn);

    if (type.real) {
      const realBtn = document.createElement('button');
      realBtn.className = 'hotspot';
      realBtn.setAttribute('style', HOTSPOT_TWO_BTN.real);
      realBtn.setAttribute('data-audio', type.real);
      realBtn.setAttribute('data-status-for', 'playStatus');
      realBtn.setAttribute('aria-label', '실제 피싱범 목소리');
      layer.appendChild(realBtn);
    }

    document.querySelectorAll('[data-audio]').forEach(setupAudioButton);
    syncHotspotLayer(img, layer);
  }
</script>
</body>
</html>
